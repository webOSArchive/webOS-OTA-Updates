# /etc/event.d/otaready-daemon: the CE OTA client's root daemon (OTA Ready v2).
#
# Not tied to LunaSysMgr: a Luna restart (the power menu's, or a crash) must not
# kill a download or the steps that arm the update.
description "CE OTA client daemon"

start on stopped finish
stop on runlevel [06]

respawn
respawn limit 5 60

exec /usr/bin/otaready-daemon
